{% extends 'base.html' %}

{% block title %}{% if object %}Редактирование{% else %}Новое мероприятие{% endif %}{% endblock %}

{% block content %}
    <h1>{% if object %}Редактирование: {{ object.name }}{% else %}Новое мероприятие{% endif %}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить</button>
        <a href="{% if object %}{{ object.get_absolute_url }}{% else %}{% url 'event_list' %}{% endif %}">Отмена</a>
    </form>
{% endblock %}
