<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Мероприятия{% endblock %}</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 0 16px; }
        header { display: flex; justify-content: space-between; align-items: center;
                 padding: 12px 0; border-bottom: 1px solid #ddd; margin-bottom: 24px; }
        nav { display: flex; gap: 12px; align-items: center; }
        nav form { margin: 0; }
    </style>
</head>
<body>
    <header>
        <a href="{% url 'event_list' %}"><strong>Мероприятия</strong></a>
        <nav>
            {% if user.is_authenticated %}
                <span>{{ user.username }}</span>
                <a href="{% url 'event_list' %}">Мои мероприятия</a>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Войти</a>
                <a href="{% url 'signup' %}">Регистрация</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
